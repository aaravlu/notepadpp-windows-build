name: Build

on: push

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: notepad-plus-plus/notepad-plus-plus
          ref: refs/tags/v8.6.9
          path: notepad++

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Build notepad++.exe
        working-directory: notepad++/PowerEditor/visual.net
        run: |
          msbuild notepadPlus.sln `
          /p:PlatformToolset=v142 `
          /p:WindowsTargetPlatformVersion=10.0.19041.0 `
          /p:Platform=x64 `
          /p:Configuration=Release `
          /p:WholeProgramOptimization=true `
          /p:Optimization=MinSpace `
          /p:FunctionLevelLinking=true

      - name: Archive Binary
        uses: actions/upload-artifact@v5
        with:
          name: notepad++
          path: |
            notepad++/PowerEditor/bin64/*.exe
            notepad++/PowerEditor/bin64/*.dll
